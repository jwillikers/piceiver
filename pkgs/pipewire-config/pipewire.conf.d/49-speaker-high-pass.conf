# Bass management: remove the bass below the crossover frequency from the bookshelf speakers.
# The subwoofer still receives the full range and its own low-pass filter takes the bass below the crossover frequency.
# Set the subwoofer's crossover frequency to match, 80 Hz.
#
# Two cascaded second-order Butterworth high-pass filters form a fourth-order Linkwitz-Riley high-pass filter.
# Its slope of 24 dB per octave matches the low-pass filter of the JBL SUB 550P subwoofer.
context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Bookshelf Speakers (80 Hz High-Pass)"
        media.name = "Bookshelf Speakers (80 Hz High-Pass)"
        filter.graph = {
            nodes = [
                {   type = builtin
                    name = high_pass_1
                    label = bq_highpass
                    control = { "Freq" = 80.0 "Q" = 0.707 }
                }
                {   type = builtin
                    name = high_pass_2
                    label = bq_highpass
                    control = { "Freq" = 80.0 "Q" = 0.707 }
                }
            ]
            links = [
                { output = "high_pass_1:Out" input = "high_pass_2:In" }
            ]
        }
        # The graph is duplicated for each channel.
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props = {
            node.name = "speakers_high_pass"
            media.class = Audio/Sink
            # The combined stereo sink outputs to this sink, so keep it from becoming the default sink.
            priority.session = 0
            priority.driver = 0
        }
        playback.props = {
            node.name = "speakers_high_pass.output"
            node.passive = true
            stream.dont-remix = true
            target.object = "alsa_output.platform-soc_107c000000_sound.stereo-fallback"
        }
    }
}
]
