context.modules = [
{   name = libpipewire-module-combine-stream
    args = {
        combine.mode = sink
        node.name = "Combined_Stereo_Sink"
        node.description = "2.1 Channel Stereo Combined Output"
        combine.latency-compensate = false
        combine.props = {
            audio.position = [ FL FR ]
        }
        stream.props = {
                stream.dont-remix = true                # JBL Studio 530 Stereo Speakers + JBL 550P Subwoofer
                #channelmix.lfe-cutoff = 150.0
        }
        stream.rules = [
            # The bookshelf speakers on the DigiAmp+, through the high-pass filter for bass management.
            {   matches = [
                    {   media.class = "Audio/Sink"
                        node.name = "speakers_high_pass"
                    } ]
                actions = { create-stream = {
                        combine.audio.position = [ FL FR ]
                        audio.position = [ FL FR ]
                } } }
            # The subwoofer on the USB audio adapter, which receives the full range and applies its own low-pass filter.
            {   matches = [
                    {   media.class = "Audio/Sink"
                        node.name = "alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo"
                    } ]
                actions = { create-stream = {
                        combine.audio.position = [ FL FR ]
                        audio.position = [ FL FR ]
                } } }
        ]
    }
}
]
